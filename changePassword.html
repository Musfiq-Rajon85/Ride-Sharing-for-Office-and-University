
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <link rel="stylesheet" href="CSS/ChangePassword.css">
</head>

<body>

    <div class="change-password">

        <h1>Change Password</h1>

        <p class="description">

            Update your password to keep your account secure.
        </p>

            <form action="#" method="post" id="changePasswordForm" onsubmit="return validateForm()" novalidate>


                <div class="form-group">

                    <label for="current-password">Current Password:</label><br>

                    <input type="password" id="current-password" name="current_password" placeholder="Enter current password" required><br><br>
                </div>

                <br>

                <div class="form-group">

                    <label for="new-password"> New Password:</label><br>

                    <input type="password" id="new-password" name="new_password" placeholder="Enter new password" minlength="8" required><br><br>
                </div>

                <br>

                <div class="form-group">

                    <label for="confirm-password"> Confirm New Password:</label><br>

                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Re-enter new password" minlength="8" required><br><br>

                </div>

                <br>

                <div class="form-group">

                    <input type="checkbox" id="show-password" name="show_password" value="yes">

                    <label for="show-password"> Show Password </label>

                </div>

            <div class="button-group">

               <input type="submit" value="Update Password" class="update-button">

               <a href="profile.html" class="cancel-button">Back to Profile</a>

            </div>

            <div class="reset-link">

                 <p>
                     Forgot your password?
                     <a href="ForgetPassword.html">Reset Password</a>
                 </p>
            </div>

            <p id="error" style="color: red;"></p>

        </form>

    </div>

    <script src="Javascript/ChangePassword.js"></script>

</body>

</html>
